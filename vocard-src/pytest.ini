[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: hits real external services (invidious-companion, Lavalink) and requires network access to them.
filterwarnings =
    # Harmless test-double artifact: a mocked create_task() captures a real
    # Player._prefetch_worker() coroutine object as an argument (for
    # assert_called_with-style inspection) without actually running it.
    # Python's GC eventually notices the unawaited coroutine and warns -
    # sometimes attributed to an unrelated later test, or even at interpreter
    # shutdown, depending entirely on GC timing, not on any one test being
    # wrong. No production code path is affected: the real create_task()
    # (not mocked) always schedules the coroutine for real.
    ignore:coroutine 'Player\._prefetch_worker' was never awaited:RuntimeWarning
