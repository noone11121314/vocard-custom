lavalink:
    plugins:
    -   dependency: dev.lavalink.youtube:youtube-plugin:1.18.2
        snapshot: false
    -   dependency: com.github.topi314.lavasrc:lavasrc-plugin:4.8.3
        snapshot: false
    server:
        bufferDurationMs: 400
        filters:
            channelMix: true
            distortion: true
            equalizer: true
            karaoke: true
            lowPass: true
            rotation: true
            timescale: true
            tremolo: true
            vibrato: true
            volume: true
        frameBufferDurationMs: 5000
        gc-warnings: true
        nonAllocatingFrameBuffer: false
        opusEncodingQuality: 10
        password: YOUR_LAVALINK_PASSWORD
        playerUpdateInterval: 5
        resamplingQuality: LOW
        soundcloudSearchEnabled: true
        sources:
            bandcamp: true
            http: true
            local: false
            nico: true
            soundcloud: true
            twitch: true
            vimeo: true
            youtube: false
        trackStuckThresholdMs: 10000
        useSeekGhosting: true
        youtubePlaylistLoadLimit: 6
        youtubeSearchEnabled: true
logging:
    file:
        path: ./logs/
    level:
        lavalink: INFO
        root: INFO
    logback:
        rollingpolicy:
            max-file-size: 1GB
            max-history: 30
    request:
        enabled: true
        includeClientInfo: true
        includeHeaders: false
        includePayload: true
        includeQueryString: true
        maxPayloadLength: 10000
metrics:
    prometheus:
        enabled: false
        endpoint: /metrics
plugins:
    lavasrc:
        applemusic:
            albumLoadLimit: 6
            countryCode: US
            keyID: your key id
            mediaAPIToken: your apple music api token
            musicKitKey: '-----BEGIN PRIVATE KEY-----

                your key

                -----END PRIVATE KEY-----

                '
            playlistLoadLimit: 6
            teamID: your team id
        deezer:
            formats:
            - FLAC
            - MP3_320
            - MP3_256
            - MP3_128
            - MP3_64
            - AAC_64
            masterDecryptionKey: your master decryption key
        flowerytts:
            audioFormat: mp3
            silence: 0
            speed: 1.0
            translate: false
            voice: default voice
        lyrics-sources:
            deezer: false
            spotify: false
            vkmusic: false
            yandexmusic: false
            youtube: false
        providers:
        - ytsearch:"%ISRC%"
        - ytsearch:%QUERY%
        sources:
            applemusic: false
            deezer: false
            flowerytts: false
            spotify: true
            vkmusic: false
            yandexmusic: false
            youtube: false
        spotify:
            albumLoadLimit: 6
            clientId: ''
            clientSecret: ''
            countryCode: US
            customTokenEndpoint: ''
            localFiles: false
            playlistLoadLimit: 6
            preferAnonymousToken: false
            resolveArtistsInSearch: true
        vkmusic:
            artistLoadLimit: 1
            playlistLoadLimit: 1
            recommendationsLoadLimit: 10
            userToken: your user token
        yandexmusic:
            accessToken: your access token
            albumLoadLimit: 1
            artistLoadLimit: 1
            playlistLoadLimit: 1
        youtube:
            countryCode: US
    youtube:
        allowDirectPlaylistIds: true
        allowDirectVideoIds: true
        allowSearch: true
        cookies:
              path: "./cookies.txt"
        clients:
          - TV
          - MUSIC
          - ANDROID_VR
          - WEB
          - WEBEMBEDDED
        enabled: true
        oauth:
          enabled: true
          refreshToken: ''  # set your own YouTube OAuth refresh token
          skipInitialization: false
sentry:
    dsn: ''
    environment: ''
server:
    address: 0.0.0.0
    http2:
        enabled: true
    password: YOUR_LAVALINK_PASSWORD
    port: 2333
